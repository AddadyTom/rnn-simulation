# Size-matched task-only control: same as train_vagal_oi151.yaml, but 908 units like the fit.
# Easy task, VagalOpto->NoReward, with the rig's timing from the lab README:
# light 0 s | opto 1-5 s (15 Hz, no-go trials) | odor 5-7 s | reward window 7-9 s
# (valve at the first lick, about 7.2 s) | 1 s after.
name: vagal_oi151_n908
seeds: [0, 1, 2]
task:
  name: VagalOptoDetection
  dt: 20
  timing: {baseline: 1000, stimulus: 4000, delay: 0, odor: 2000, response: 2000, outcome: 1000}
  contingency: no_reward
  train_frequencies: [15.0]
  eval_frequencies: [0.5, 1.0, 2.0, 3.0, 5.0, 8.0, 15.0]   # lower ones only probe the network (Q2 prediction)
  p_stim: 0.5
  opsin_tau: 150        # ms
  gain_cv: 0.3
  input_noise: 0.5
  response_weight: 5.0  # licks in the reward window count most
  odor_weight: 1.0      # licking during the odor is allowed on go trials (the mouse starts there)
  reward_delay: 200     # ms into the reward window; the valve opened at 7.2 s
  reward_ms: 1000
model:
  n_units: 908          # same size as the network fitted to OI151 (size-matched control)
  frac_exc: 0.8
  tau: 100
  noise_std: 0.05
  dale: true
steps: 600
batch_size: 32
lr: 0.002
rate_l2: 0.001
weight_l2: 0.0001
eval_every: 200
out_dir: runs
